{% extends "base.html" %}

{% block title %}Server Error - Denncathy Fresh Basket{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h1 class="display-1">500</h1>
            <h2 class="mb-4">Internal Server Error</h2>
            <p class="lead text-muted mb-4">
                We're sorry, but something went wrong on our end. We've been notified and are working to fix it.
            </p>
            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg">
                    <i class="fas fa-home"></i> Go Home
                </a>
                <a href="mailto:support@denncathy.co.ke" class="btn btn-outline-secondary btn-lg">
                    <i class="fas fa-envelope"></i> Contact Support
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
